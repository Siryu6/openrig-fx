name: LV2 tools
description: >
  What cargo xtask validates bundles with: serdi, sord_validate and
  lv2_validate (LV2 schemas), jackd (dummy backend) and jalv from the
  distribution; lv2lint, which Debian and Ubuntu do not package, built
  from its release and cached.
inputs:
  lv2lint-version:
    description: lv2lint release
    default: "0.16.2"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          serdi sordi lv2-dev liblilv-dev jackd2 jalv \
          meson ninja-build pkg-config build-essential libelf-dev libcurl4-openssl-dev
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.local/lv2lint
        key: lv2lint-${{ inputs.lv2lint-version }}-${{ runner.os }}-${{ runner.arch }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        version=${{ inputs.lv2lint-version }}
        curl -fsSL "https://git.ventosus.ch/lv2lint/archive/$version.tar.gz" | tar xz
        cd lv2lint-$version
        meson setup build --prefix "$HOME/.local/lv2lint" --buildtype release
        ninja -C build install
    - shell: bash
      run: echo "$HOME/.local/lv2lint/bin" >> "$GITHUB_PATH"
